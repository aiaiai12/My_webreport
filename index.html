.card{backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);width:100%;max-width:460px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px;position:relative;z-index:2}
h1{font-family:'Reem Kufi','Cairo',serif;font-size:32px;font-weight:700;margin:0 0 18px;line-height:1.4;letter-spacing:.5px;color:#f6f3ec;text-shadow:0 0 8px rgba(255,255,255,.6),0 0 24px rgba(255,255,255,.3),0 2px 10px rgba(0,0,0,.6)}
label{display:block;color:var(--mut);font-size:14px;margin:14px 0 6px}
input,textarea{width:100%;background:var(--field);color:var(--txt);border:1px solid var(--line);border-radius:16px;padding:14px;font:inherit;font-size:16px;outline:none}
input[dir=ltr]{text-align:left}
input:focus,textarea:focus{border-color:var(--red);box-shadow:0 0 14px rgba(225,220,208,.4)}
textarea{min-height:170px;resize:vertical}
button{font:inherit;font-weight:700;font-size:17px;border:0;border-radius:18px;padding:16px;cursor:pointer;color:#fff;width:100%}
.main{background:linear-gradient(90deg,#b8b3a7,var(--red2));margin-top:20px;color:#15140f}
.main:active{transform:scale(.98)}
.row{display:flex;gap:10px;margin-top:12px}
.sec{background:rgba(70,68,62,.65);font-weight:400}
.tg{display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;color:#fff;font-weight:700;font-size:16px;padding:10px 16px;border-radius:16px;background:rgba(70,68,62,.65);border:1px solid var(--line);margin-bottom:18px}
.tg:active{transform:scale(.98)}
.tg svg{width:22px;height:22px;fill:#fff}
.tg span{direction:ltr}
.note{color:var(--mut);font-size:13px;text-align:center;margin-top:16px}
.count{display:flex;justify-content:center;align-items:center;gap:10px;margin-top:8px;color:var(--mut)}
.count b{background:#5c594f;color:#fff;border-radius:20px;min-width:44px;padding:2px 14px;text-align:center;font-size:20px}
#prev{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:9;align-items:center;justify-content:center;padding:18px}
#prev div{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;max-width:460px;width:100%;max-height:80vh;overflow:auto;white-space:pre-wrap;line-height:1.8}
#prev p{margin:0 0 6px;color:var(--mut);font-size:13px}
.apps{display:flex;flex-wrap:wrap;gap:8px}
.app{width:auto;padding:9px 16px;font-size:15px;border-radius:14px;background:rgba(70,68,62,.65);border:1px solid var(--line);font-weight:700}
.app.on{background:linear-gradient(90deg,#b8b3a7,var(--red2));color:#15140f}
.list{display:none;margin-top:10px;background:var(--field);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.item{display:block;width:100%;text-align:right;background:none;border-radius:0;padding:12px 14px;border-bottom:1px solid var(--line);font-weight:400;font-size:15px}
.item:last-child{border-bottom:0}
.item b{display:block;direction:ltr;text-align:left;font-size:16px}
.item small{color:var(--mut);font-size:13px}
.item.sel{background:rgba(255,255,255,.12)}
.hint{color:var(--mut);font-size:12.5px;margin-top:6px}
.nt{padding:12px 14px;color:var(--mut);font-size:13px}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#5c594f;padding:10px 20px;border-radius:14px;z-index:10;display:none}
</style>
</head>
<body>
<canvas id="snow"></canvas>
<main class="card">
  <a class="tg" href="https://t.me/isAbuDawad" target="_blank" rel="noopener"><svg viewBox="0 0 24 24"><path d="M9.8 15.3l-.4 4.2c.6 0 .9-.3 1.2-.6l2.9-2.7 6 4.4c1.1.6 1.9.3 2.2-1l3.9-18.3c.4-1.6-.6-2.3-1.6-1.9L1.5 9.2c-1.6.6-1.5 1.5-.3 1.9l5.7 1.8 13.2-8.3c.6-.4 1.2-.2.7.2z"/></svg><span>@isAbuDawad</span></a>
  <h1>الروسي أشرف يرسل تحياته</h1>

  <label>اختر التطبيق لاختيار بريد الدعم</label>
  <div class="apps" id="apps"></div>
  <div class="list" id="list"></div>

  <label for="to">بريد الدعم</label>
  <input id="to" type="email" dir="ltr" placeholder="abuse@telegram.org" autocomplete="off">

  <label for="sub">الموضوع</label>
  <input id="sub" type="text">

  <label for="body">نص البلاغ</label>
  <textarea id="body"></textarea>

  <button class="main" id="send">إرسال البلاغ</button>

  <div class="row">
    <button class="sec" id="pv">👁️ معاينة</button>
    <button class="sec" id="rs">تصفير العداد</button>
  </div>

  <p class="note">تم حفظ المسودة على هذا الجهاز</p>
  <div class="count">عدد البلاغات المرسلة: <b id="n">0</b></div>
</main>

<div id="prev"><div id="pvbox"></div></div>
<div id="toast"></div>

<script>
const $=id=>document.getElementById(id);
const store={
  get(k,d){try{const v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,v)}catch(e){}}
};
const fields=['to','sub','body'];
fields.forEach(f=>{
  $(f).value=store.get('draft_'+f,'');
  $(f).addEventListener('input',()=>store.set('draft_'+f,$(f).value));
});
let count=parseInt(store.get('count','0'))||0;
const show=()=>$('n').textContent=count;
show();

function toast(t){const e=$('toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',2200)}

$('send').onclick=()=>{
  const to=$('to').value.trim(),sub=$('sub').value.trim(),body=$('body').value.trim();
  if(!to||!/^\S+@\S+\.\S+$/.test(to)){toast('اكتب بريد دعم صحيح');return}
  if(!sub||!body){toast('اكتب الموضوع ونص البلاغ');return}
  // يفتح تطبيق البريد ليختار المستخدم ايميله — الحقول تبقى كما هي
  location.href='mailto:'+encodeURIComponent(to).replace('%40','@')+
    '?subject='+encodeURIComponent(sub)+'&body='+encodeURIComponent(body);
  count++;store.set('count',count);show();
  toast('تم فتح البريد ✅ — الحقول محفوظة');
};

$('pv').onclick=()=>{
  $('pvbox').innerHTML='';
  const mk=(l,t)=>{const p=document.createElement('p');p.textContent=l;const d=document.createElement('div');d.style.cssText='background:none;border:0;padding:0;margin-bottom:12px';d.textContent=t||'—';$('pvbox').append(p,d)};
  mk('إلى',$('to').value);mk('الموضوع',$('sub').value);mk('النص',$('body').value);
  $('prev').style.display='flex';
};
$('prev').onclick=e=>{if(e.target===$('prev'))$('prev').style.display='none'};

$('rs').onclick=()=>{if(confirm('تصفير عداد البلاغات؟')){count=0;store.set('count',0);show()}};

// قائمة جهات الدعم: عدّل أو أضف من هنا
const APPS=[
 {n:'تليجرام',e:[
  ['abuse@telegram.org','بلاغات عامة: سبام، احتيال، محتوى مخالف'],
  ['stopCA@telegram.org','بلاغات محتوى الاعتداء على الأطفال'],
  ['dmca@telegram.org','حقوق النشر'],
  ['recover@telegram.org','استرجاع حساب محذوف أو رقم محظور'],
  ['security@telegram.org','ثغرات ومشاكل أمنية'],
  ['support@telegram.org','دعم عام']]},
 {n:'واتساب',e:[
  ['support@whatsapp.com','دعم عام ومراجعة حظر الرقم'],
  ['ip@whatsapp.com','حقوق النشر والعلامات التجارية']]},
 {n:'تويتر (X)',e:[
  ['copyright@x.com','حقوق النشر (DMCA)']],
  note:'باقي البلاغات من زر الإبلاغ داخل التطبيق أو مركز المساعدة، ما فيه بريد بلاغات عام.'},
 {n:'تيك توك',e:[
  ['feedback@tiktok.com','ملاحظات واستفسارات عامة'],
  ['reports@tiktok.com','الإبلاغ عن روابط ومواقع تصيّد باسم تيك توك']],
  note:'بلاغات المحتوى والحقوق تتم من النماذج داخل التطبيق.'}
];
let cur=-1;
function renderApps(){
  const box=$('apps');box.innerHTML='';
  APPS.forEach((a,i)=>{
    const b=document.createElement('button');b.className='app'+(i===cur?' on':'');b.textContent=a.n;
    b.onclick=()=>{cur=(cur===i?-1:i);renderApps();renderList()};
    box.appendChild(b);
  });
}
function renderList(){
  const l=$('list');l.innerHTML='';
  if(cur<0){l.style.display='none';return}
  const a=APPS[cur];l.style.display='block';
  a.e.forEach(([m,d])=>{
    const b=document.createElement('button');b.className='item'+($('to').value.trim().toLowerCase()===m.toLowerCase()?' sel':'');
    const em=document.createElement('b');em.textContent=m;
    const sm=document.createElement('small');sm.textContent='/ '+d;
    b.append(em,sm);
    b.onclick=()=>{$('to').value=m;store.set('draft_to',m);renderList();toast('تم اختيار البريد');$('to').scrollIntoView({behavior:'smooth',block:'center'})};
    l.appendChild(b);
  });
  if(a.note){const n=document.createElement('div');n.className='nt';n.textContent=a.note;l.appendChild(n)}
}
renderApps();
$('to').addEventListener('input',renderList);

// الثلج
const c=$('snow'),x=c.getContext('2d');let W,H,flakes=[];
function size(){W=c.width=innerWidth;H=c.height=innerHeight}
size();addEventListener('resize',size);
for(let i=0;i<70;i++)flakes.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*3+1,s:Math.random()*1+.4,d:Math.random()*Math.PI*2});
function tick(){
  x.clearRect(0,0,W,H);x.fillStyle='rgba(255,255,255,.9)';
  flakes.forEach(f=>{
    f.y+=f.s;f.d+=.01;f.x+=Math.sin(f.d)*.5;
    if(f.y>H){f.y=-5;f.x=Math.random()*W}
    x.beginPath();x.arc(f.x,f.y,f.r,0,7);x.fill();
  });
  requestAnimationFrame(tick);
}
if(!matchMedia('(prefers-reduced-motion: reduce)').matches)tick();
</script>
</body>
</html>
